services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskbot
      POSTGRES_USER: taskbot
      POSTGRES_PASSWORD: taskbot
    ports:
      - "5432:5432"
    volumes:
      - taskbot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskbot -d taskbot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  taskbot-postgres:
